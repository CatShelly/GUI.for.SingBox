name: Release SingBox WebUI
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: go test ./...
      - run: |
          for arch in amd64 arm64; do
            out="dist/singbox-webui-linux-$arch"
            mkdir -p "$out/deploy"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "$out/singbox-webui" .
            cp deploy/* "$out/deploy/"
            cp README.md LICENSE "$out/"
            package="singbox-webui-linux-$arch"
            tar -C dist -czf "$out.tar.gz" "$package/singbox-webui" "$package/README.md" "$package/LICENSE" "$package/deploy/singbox-webui.service" "$package/deploy/nginx.conf.example"
          done
      - name: Generate checksums
        working-directory: dist
        run: sha256sum singbox-webui-linux-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: singbox-webui-linux
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'dev') }}
          generate_release_notes: true
